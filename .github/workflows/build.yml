name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Dosyalari duzenle
        run: |
          mkdir -p src/main/java/com/example/replay
          mv MainActivity.kt ReplayService.kt src/main/java/com/example/replay/
          mv AndroidManifest.xml src/main/

      - name: APK derle
        run: gradle assembleDebug --no-daemon --console=plain > build.log 2>&1

      - name: Hata ozeti
        if: failure()
        run: |
          echo "## Derleme hatasi" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 25 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Release olarak yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Replay APK ${{ github.run_number }}
          files: build/outputs/apk/debug/*.apk
